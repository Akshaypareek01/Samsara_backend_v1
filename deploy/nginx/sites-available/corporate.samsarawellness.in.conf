# CRM reverse proxy.
# Merge client_max_body_size into the LIVE site config — do not blindly replace
# cert/upstream paths. After changes: nginx -t && systemctl reload nginx
#
# Uploads go to the API, but pin the body size here too so a future rewrite/proxy
# hop cannot 413 below Multer. Adjust the upstream port to match the live Next.js process.

upstream samsara_crm {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name corporate.samsarawellness.in;

    include /etc/nginx/snippets/client-max-body-size.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corporate.samsarawellness.in;

    include /etc/nginx/snippets/client-max-body-size.conf;

    ssl_certificate /etc/letsencrypt/live/corporate.samsarawellness.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corporate.samsarawellness.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://samsara_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }
}
