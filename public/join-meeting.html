<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Zoom Meeting</title>
    <link type="text/css" rel="stylesheet" href='https://source.zoom.us/3.1.6/css/bootstrap.css' />
    <link type="text/css" rel="stylesheet" href='https://source.zoom.us/3.1.6/css/react-select.css' />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            z-index: 999999;
            transition: opacity 0.5s ease-out;
        }
        #loading-container.hiding {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #2d8cff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #fff;
            font-size: 18px;
            margin-top: 10px;
        }
        .loading-text.subtitle {
            font-size: 14px;
            color: #999;
            margin-top: 5px;
        }
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999999;
            max-width: 400px;
            display: none !important; /* Hidden from users, only for console debugging */
        }
        .error-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            padding: 20px;
            text-align: center;
        }
        .error-message {
            color: #ff4444;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .error-details {
            color: #999;
            font-size: 14px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Loading Zoom Meeting...</div>
        <div class="loading-text subtitle" id="loading-status">Please allow camera and microphone access when prompted</div>
    </div>

    <div id="error-container" class="error-container" style="display: none;">
        <div class="error-message" id="error-message">Failed to join meeting</div>
        <div class="error-details" id="error-details"></div>
    </div>

    <div id="zoom-meeting-container"></div>
    
    <!-- Debug info (hidden from users) -->
    <div id="debug-info" class="debug-info" style="display: none !important;">
        <div><strong>Debug Status:</strong></div>
        <div id="debug-status">Initializing...</div>
    </div>

    <!-- Load Zoom SDK dependencies - Version 3.1.6 (Minimum supported as of Feb 2025) -->
    <script src="https://source.zoom.us/3.1.6/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/lodash.min.js"></script>
    
    <!-- Load Zoom Meeting SDK - Version 3.1.6 (Minimum supported as of Feb 2025)
         Note: Check https://marketplace.zoom.us/docs/sdk/native-sdks/web for latest version -->
    <script src="https://source.zoom.us/3.1.6/zoom-meeting-3.1.6.min.js" 
            onload="console.log('Zoom SDK 3.1.6 loaded successfully'); window.zoomSdkLoaded = true;"
            onerror="console.error('Failed to load Zoom SDK - check version and CDN availability'); window.zoomSdkError = true;"></script>

    <script>
        // Device detection helper function
        const isMobileDevice = () => {
            // Check screen width (mobile typically <= 768px)
            const isSmallScreen = window.innerWidth <= 768 || window.screen.width <= 768;
            
            // Check user agent for mobile devices
            const isMobileUserAgent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // Check for touch capability (most mobile devices have touch)
            const hasTouchScreen = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            // Consider it mobile if it's a small screen OR has mobile user agent
            return isSmallScreen || (isMobileUserAgent && hasTouchScreen);
        };

        /**
         * Resolves where Zoom SDK / leave flows should send the user.
         * CRM passes ?leaveUrl=...; forceHost defaults to CRM classes (not Amplify consumer).
         * @returns {string}
         */
        const resolveLeaveUrl = () => {
            const params = new URLSearchParams(window.location.search);
            const fromQuery = params.get('leaveUrl');
            if (fromQuery) {
                try {
                    return decodeURIComponent(fromQuery);
                } catch (e) {
                    return fromQuery;
                }
            }
            if (params.get('forceHost') === '1') {
                // CRM desktop host join — never dump onto consumer Amplify
                return 'http://localhost:3000/apps/crm/classes/';
            }
            if (isMobileDevice()) {
                return 'samsara://';
            }
            return 'https://main.d21u027aqec24o.amplifyapp.com/Homepage/Classes';
        };
        
        // Redirect function - called when meeting ends or user leaves
        const redirectAfterMeeting = () => {
            // Prevent multiple redirects
            if (window.redirecting) {
                return;
            }
            window.redirecting = true;
            const target = resolveLeaveUrl();
            console.log('Meeting ended — redirecting to', target);
            window.location.href = target;
        };
        
        // Make redirect function globally accessible
        window.redirectAfterMeeting = redirectAfterMeeting;

        // Debug helper function (only logs to console, doesn't show on screen)
        const updateDebugStatus = (status) => {
            // Only log to console, don't show on screen
            console.log('🔍 DEBUG STATUS:', status);
            const statusEl = document.getElementById('debug-status');
            if (statusEl) {
                statusEl.textContent = status; // Update for console inspection only
            }
        };

        /**
         * Shows a clear error when Zoom host-conflict dialog would otherwise loop reloads.
         */
        const showHostConflictHelp = () => {
            showError(
                'Cannot join as Zoom host',
                'Close the Zoom desktop app signed in as the Samsara Zoom account (tech.samsarawellness@gmail.com), then click Join again from CRM. Do not click “End and Start New Meeting” — that can delete the class meeting.'
            );
        };

        /**
         * Never click "End and Start" — it deletes the class meeting on Basic accounts.
         * Cancel the dialog and fall back to Zoom Web Client join as instructor.
         * @param {string} meetingNumber
         * @param {string} password
         */
        const fallbackInstructorToWebClient = (meetingNumber, password) => {
            if (window.__samsaraWcFallbackDone) return;
            window.__samsaraWcFallbackDone = true;
            const pwd = password ? `?pwd=${encodeURIComponent(password)}` : '';
            const wcUrl = `https://zoom.us/wc/join/${meetingNumber}${pwd}`;
            console.warn('⚠️ Host SDK blocked — falling back to WC instructor join:', wcUrl);
            window.location.replace(wcUrl);
        };

        /**
         * Host start via classic Zoom URL + ZAK.
         * Basic accounts reject Meeting SDK host tokens with "We don't support this login way".
         * @param {string} meetingNumber
         * @param {string} zak
         */
        const startAsHostViaClassicZoom = (meetingNumber, zak) => {
            if (window.__samsaraClassicHostStartDone) return;
            window.__samsaraClassicHostStartDone = true;
            if (!zak) {
                showError(
                    'Cannot start as Zoom host',
                    'Missing ZAK token. Check Server-to-Server OAuth scopes (user:read:token:admin).'
                );
                return;
            }
            const startUrl = `https://zoom.us/s/${encodeURIComponent(meetingNumber)}?zak=${encodeURIComponent(zak)}`;
            console.warn('⚠️ Meeting SDK host blocked — opening classic Zoom host start:', startUrl);
            window.location.replace(startUrl);
        };

        /**
         * Watches for Zoom's host-conflict modal and cancels it (never End and Start).
         * @param {string} meetingNumber
         * @param {string} password
         * @param {boolean} forceHost - CRM admin: show help instead of WC attendee fallback
         */
        const watchHostConflictDialog = (meetingNumber, password, forceHost = false) => {
            const tick = () => {
                const buttons = Array.from(document.querySelectorAll('button, [role="button"], a'));
                let cancelBtn = null;
                let endStartBtn = null;
                for (const btn of buttons) {
                    const t = (btn.textContent || '').replace(/\s+/g, ' ').trim();
                    if (/^cancel$/i.test(t)) cancelBtn = btn;
                    if (/end and start/i.test(t)) endStartBtn = btn;
                }
                const bodyText = (document.body && document.body.innerText) || '';
                if (endStartBtn && /hosting another meeting/i.test(bodyText)) {
                    console.warn('⚠️ Host conflict dialog detected — Cancel (not End and Start)');
                    try {
                        if (cancelBtn) cancelBtn.click();
                    } catch (e) {}
                    if (forceHost) {
                        showHostConflictHelp();
                    } else {
                        fallbackInstructorToWebClient(meetingNumber, password);
                    }
                    return true;
                }
                return false;
            };
            tick();
            const obs = new MutationObserver(() => tick());
            obs.observe(document.documentElement, { childList: true, subtree: true });
            setTimeout(() => obs.disconnect(), 60000);
        };
        
        // Wait for DOM and scripts to load
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                updateDebugStatus('DOM loaded, waiting for Zoom SDK...');
                console.log('DOM loaded, waiting for Zoom SDK...');
                
                // Wait for Zoom SDK to load
                let attempts = 0;
                const maxAttempts = 50; // 5 seconds max wait
                while (!window.ZoomMtg && !window.zoomSdkError && attempts < maxAttempts) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (window.zoomSdkError || !window.ZoomMtg) {
                    throw new Error('Zoom Meeting SDK failed to load. Please check your internet connection and try again.');
                }
                
                updateDebugStatus('Zoom SDK ready');
                console.log('Zoom SDK is ready');
                // Get query parameters
                const urlParams = new URLSearchParams(window.location.search);
                let meetingNumber = urlParams.get('meetingNumber') || urlParams.get('mn');
                let password = urlParams.get('password') || urlParams.get('pwd') || '';
                let userName = urlParams.get('userName') || urlParams.get('name') || 'Guest';
                const userEmail = urlParams.get('email') || urlParams.get('userEmail') || '';
                const role = parseInt(urlParams.get('role') || '0'); // 0 = participant, 1 = host
                const forceHost = urlParams.get('forceHost') === '1'; // CRM admin desktop host
                let accountId = urlParams.get('accountId') || null;
                const classId = urlParams.get('classId') || null;
                const sessionId = urlParams.get('sessionId') || null;
                const eventId = urlParams.get('eventId') || null;
                // Get base URL - use current origin (handles any port)
                const apiBaseUrl = urlParams.get('apiBaseUrl') || window.location.origin;

                // Get API base URL (remove /public/join-meeting if present)
                const baseUrl = apiBaseUrl.replace(/\/v1\/zoom\/join-meeting$/, '').replace(/\/public\/join-meeting$/, '');

                // If classId/sessionId/eventId is provided AND meeting number missing, fetch details
                // (requires auth — prefer meetingNumber in query from the app)
                if ((!meetingNumber) && (classId || sessionId || eventId)) {
                    console.log('Fetching meeting details from database...');
                    const detailsParams = new URLSearchParams();
                    if (classId) detailsParams.append('classId', classId);
                    if (sessionId) detailsParams.append('sessionId', sessionId);
                    if (eventId) detailsParams.append('eventId', eventId);

                    const detailsResponse = await fetch(`${baseUrl}/v1/zoom/getMeetingDetails?${detailsParams.toString()}`);
                    
                    if (!detailsResponse.ok) {
                        const errorData = await detailsResponse.json().catch(() => ({}));
                        throw new Error(errorData.message || `Failed to fetch meeting details: ${detailsResponse.status}`);
                    }

                    const detailsData = await detailsResponse.json();
                    
                    if (detailsData.status !== 'success') {
                        throw new Error(detailsData.message || 'Failed to fetch meeting details');
                    }

                    // Use meeting details from database
                    meetingNumber = detailsData.data.meetingNumber;
                    password = detailsData.data.password || '';
                    accountId = detailsData.data.accountId || accountId;

                    console.log('Meeting details fetched:', {
                        meetingNumber,
                        password: password ? '***' : '(none)',
                        accountId
                    });
                }

                // Validate required parameters
                if (!meetingNumber) {
                    throw new Error('Meeting number is required. Please provide ?meetingNumber=XXX or ?classId=XXX in the URL.');
                }

                console.log('Meeting join parameters:', {
                    meetingNumber,
                    userName,
                    userEmail,
                    role,
                    accountId,
                    hasPassword: !!password
                });

                // Fetch SDK signature from backend
                const signatureResponse = await fetch(`${baseUrl}/v1/zoom/generateSDKSignature`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        meetingNumber: meetingNumber,
                        role: role,
                        accountId: accountId,
                        classId: classId,
                        sessionId: sessionId,
                        eventId: eventId
                    })
                });

                if (!signatureResponse.ok) {
                    const errorData = await signatureResponse.json().catch(() => ({}));
                    throw new Error(errorData.message || `Failed to generate signature: ${signatureResponse.status}`);
                }

                const signatureData = await signatureResponse.json();
                
                if (signatureData.status !== 'success') {
                    throw new Error(signatureData.message || 'Failed to generate signature');
                }

                const { signature, sdkKey, zak, hostEmail, hostName, zoomAccountType } = signatureData.data;
                // Host start requires ZAK + the Zoom host email (CRM often sends empty email)
                const joinEmail = (role === 1 ? (hostEmail || userEmail) : userEmail) || '';
                if (role === 1 && hostName && (!userName || userName === 'Admin' || userName === 'Guest')) {
                    userName = hostName;
                }
                console.log('SDK signature generated successfully');
                console.log('Account info:', {
                    accountId: signatureData.data.accountId,
                    sdkKey: sdkKey.substring(0, 10) + '...',
                    role: role,
                    hasZak: !!zak,
                    joinEmail: joinEmail || '(none)',
                    userName,
                    zoomAccountType
                });

                if (role === 1 && !zak) {
                    throw new Error('Host join requires a Zoom ZAK token, but none was returned by the server.');
                }
                // Basic Zoom: Meeting SDK role=1 fails with "We don't support this login way".
                // CRM forceHost → classic /s/{mn}?zak= (real host). Teachers → WC join.
                if (role === 1 && zoomAccountType === 1) {
                    if (forceHost) {
                        console.warn('⚠️ Zoom Basic + CRM host — classic Zoom start with ZAK (SDK host unsupported).');
                        startAsHostViaClassicZoom(meetingNumber, zak);
                        return;
                    }
                    console.warn('⚠️ Zoom Basic — SDK host blocked. Redirecting to Web Client instructor join.');
                    fallbackInstructorToWebClient(meetingNumber, password);
                    return;
                }
                if (role === 1) {
                    watchHostConflictDialog(meetingNumber, password, forceHost);
                }

                // ZoomMtg should already be available from the script load
                const ZoomMtg = window.ZoomMtg;
                if (!ZoomMtg) {
                    throw new Error('Zoom Meeting SDK is not available. Please refresh the page.');
                }
                
                console.log('Initializing Zoom SDK...');
                
                // Check for SharedArrayBuffer support (required for gallery view)
                if (typeof SharedArrayBuffer === 'undefined') {
                    console.warn('⚠️ SharedArrayBuffer is not available. Gallery view may not work.');
                    console.warn('⚠️ This usually means CORS headers are not set correctly.');
                    console.warn('⚠️ Required headers: Cross-Origin-Embedder-Policy: require-corp, Cross-Origin-Opener-Policy: same-origin');
                } else {
                    console.log('✅ SharedArrayBuffer is available - Gallery view will work!');
                }
                
                // Check system requirements
                const systemRequirements = ZoomMtg.checkSystemRequirements();
                console.log('System requirements:', JSON.stringify(systemRequirements));
                
                // Check if gallery view is supported
                if (systemRequirements.features && systemRequirements.features.includes('GALLERY')) {
                    console.log('✅ Gallery view is supported by your browser');
                } else {
                    console.warn('⚠️ Gallery view may not be fully supported');
                }
                
                // Set Zoom JS library - Version 3.1.6
                ZoomMtg.setZoomJSLib('https://source.zoom.us/3.1.6/lib', '/av');
                
                // Pre-load WASM files
                ZoomMtg.preLoadWasm();
                
                // Prepare Web SDK
                ZoomMtg.prepareWebSDK();
                
                // Load language (required for Zoom SDK)
                ZoomMtg.i18n.load('en-US');
                
                // Create a global meetingConfig placeholder BEFORE SDK initialization
                // This ensures SDK's React components can always access it
                window.meetingConfig = {
                    meetingNumber: meetingNumber,
                    userName: userName,
                    signature: signature,
                    sdkKey: sdkKey,
                    userEmail: joinEmail,
                    passWord: password,
                    role: role,
                    accountId: signatureData.data.accountId,
                    zak: zak || undefined
                };
                window.ZoomMeetingConfig = window.meetingConfig;
                
                console.log('✅ Pre-initialized window.meetingConfig for SDK access');

                // Function to hide loading screen
                const hideLoading = () => {
                    console.log('🔍 Attempting to hide loading screen...');
                    const loadingContainer = document.getElementById('loading-container');
                    if (loadingContainer) {
                        console.log('🔍 Loading container found, hiding...');
                        // Add hiding class for smooth transition
                        loadingContainer.classList.add('hiding');
                        setTimeout(() => {
                            loadingContainer.style.display = 'none';
                            updateDebugStatus('✅ Loading screen HIDDEN');
                            console.log('✅✅✅ Loading screen HIDDEN successfully');
                        }, 500);
                    } else {
                        console.error('❌ Loading container NOT FOUND!');
                    }
                };

                // Track if join callbacks have fired
                let joinCallbacksFired = false;
                let zoomInitialized = false;

                const leaveUrl = resolveLeaveUrl();

                // Initialize Zoom SDK - only valid parameters for SDK 3.1.6
                console.log('🔧 Initializing Zoom SDK with config:', {
                    leaveUrl,
                    disableCORP: !window.crossOriginIsolated,
                    crossOriginIsolated: window.crossOriginIsolated
                });
                
                ZoomMtg.init({
                    leaveUrl,
                    disableCORP: !window.crossOriginIsolated, // Required for SharedArrayBuffer support
                    success: function(res) {
                        zoomInitialized = true;
                        console.log('✅ Zoom initialized successfully');
                        console.log('✅ Init success response:', res);
                        console.log('✅ Init success callback fired, preparing to join...');
                        console.log('✅ Zoom initialized successfully');
                        console.log('✅ Init success response:', res);
                        console.log('✅ Init success callback fired, preparing to join...');
                        
                        // Configure meeting join parameters
                        console.log('🔧 Configuring meeting join with:', {
                            meetingNumber,
                            userName,
                            hasPassword: !!password,
                            sdkKey: sdkKey.substring(0, 10) + '...'
                        });
                        
                        // Define meeting config — host role MUST include zak
                        const meetingConfig = {
                            meetingNumber: meetingNumber,
                            userName: userName || (role === 1 ? 'Host' : 'Participant'),
                            signature: signature,
                            sdkKey: sdkKey,
                            userEmail: joinEmail,
                            passWord: password,
                            ...(zak ? { zak } : {}),
                            success: function(res) {
                                joinCallbacksFired = true;
                                updateDebugStatus('✅ JOIN SUCCESS! Hiding loading...');
                                console.log('✅✅✅ SUCCESS CALLBACK FIRED!');
                                console.log('✅✅✅ Meeting joined successfully!', res);
                                
                                // Hide loading immediately - meeting is joining
                                console.log('🚀 Hiding loading screen immediately...');
                                hideLoading();
                                
                                // Set up meeting event listeners
                                try {
                                    // Listen for meeting status changes
                                    ZoomMtg.inMeetingServiceListener("onMeetingStatus", function (data) {
                                        console.log("📊 Meeting status changed:", data);
                                        hideLoading(); // Hide whenever status changes
                                        
                                        // Check if meeting has ended
                                        // Meeting status: 0=connecting, 1=in meeting, 2=waiting for host, 3=ended
                                        if (data.meetingStatus === 3 || data.meetingStatus === 'ENDED' || 
                                            (data.meetingStatus && data.meetingStatus.toString().includes('ENDED'))) {
                                            console.log("🏁 Meeting ended, redirecting...");
                                            setTimeout(() => {
                                                redirectAfterMeeting();
                                            }, 1000); // Small delay to ensure cleanup
                                        }
                                    });
                                    
                                    // Listen for when user leaves
                                    ZoomMtg.inMeetingServiceListener("onUserLeave", function (data) {
                                        console.log("👋 User left meeting:", data);
                                        // Check if it's the current user leaving
                                        if (data && (data.userId === window.meetingConfig?.userEmail || data.leaveReason)) {
                                            console.log("👋 Current user left, redirecting...");
                                            setTimeout(() => {
                                                redirectAfterMeeting();
                                            }, 1000);
                                        }
                                    });
                                    
                                    // Listen for when user joins
                                    ZoomMtg.inMeetingServiceListener("onUserJoin", function (data) {
                                        console.log("👤 User joined meeting:", data);
                                        hideLoading();
                                    });
                                    
                                    // Listen for waiting room
                                    ZoomMtg.inMeetingServiceListener("onUserIsInWaitingRoom", function (data) {
                                        console.log("🚪 Waiting room status:", data);
                                        hideLoading();
                                    });
                                    
                                    // Listen for meeting end event
                                    ZoomMtg.inMeetingServiceListener("onMeetingEnd", function (data) {
                                        console.log("🏁 Meeting end event triggered:", data);
                                        setTimeout(() => {
                                            redirectAfterMeeting();
                                        }, 1000);
                                    });
                                    
                                } catch (e) {
                                    console.warn("Could not set up meeting listeners:", e);
                                }
                                
                                // Additional fallback: Check for Zoom DOM elements
                                const checkZoomContent = setInterval(() => {
                                    const hasZoomContent = document.querySelector('[id^="zmmtg-root"]') || 
                                                          document.querySelector('.zm-video-container') ||
                                                          document.querySelector('.zm-client-view') ||
                                                          document.querySelector('#wc-container') ||
                                                          document.querySelector('.zm-video-view');
                                    
                                    if (hasZoomContent) {
                                        console.log('✅ Zoom content detected, hiding loading screen');
                                        hideLoading();
                                        clearInterval(checkZoomContent);
                                    }
                                }, 500);
                                
                                // Stop checking after 8 seconds
                                setTimeout(() => {
                                    clearInterval(checkZoomContent);
                                    console.log('⏰ 8 second timeout - hiding loading as fallback');
                                    hideLoading(); // Final fallback
                                }, 8000);
                            },
                            error: function(res) {
                                joinCallbacksFired = true;
                                updateDebugStatus('❌ JOIN ERROR - Check console');
                                console.error('❌❌❌ ERROR joining meeting:', res);
                                
                                let errorMessage = res.reason || res.errorMessage || res.error || 'Unknown error';
                                const errorText = String(errorMessage).toLowerCase();
                                const isUnsupportedHostLogin =
                                    errorText.includes('login way') ||
                                    errorText.includes('not support start') ||
                                    errorText.includes('via tokens') ||
                                    res.errorCode === 3265;
                                const isHostConflict =
                                    res.errorCode === 3000 ||
                                    errorText.includes('other meetings in progress') ||
                                    errorText.includes('hosting another meeting') ||
                                    errorText.includes('cannot not host another');

                                // Basic / token host start rejected by Zoom SDK
                                if (role === 1 && isUnsupportedHostLogin && zak) {
                                    startAsHostViaClassicZoom(meetingNumber, zak);
                                    return;
                                }

                                // Host conflict: never End and Start
                                if (role === 1 && isHostConflict) {
                                    if (forceHost) {
                                        showHostConflictHelp();
                                    } else {
                                        fallbackInstructorToWebClient(meetingNumber, password);
                                    }
                                    return;
                                }

                                if (isHostConflict) {
                                    showHostConflictHelp();
                                    return;
                                }

                                if (res.errorCode === 1 || errorText.includes('recaptcha') || errorText.includes('limit')) {
                                    errorMessage = 'Zoom has temporarily limited access. Please wait a few minutes and try again.';
                                }
                                
                                showError('Failed to join meeting', errorMessage);
                            }
                        };
                        
                        // CRITICAL: Update window.meetingConfig with callbacks
                        // The SDK's React components access this from closures, so it must be on window
                        Object.assign(window.meetingConfig, meetingConfig);
                        window.ZoomMeetingConfig = window.meetingConfig;
                        
                        console.log('✅ Updated window.meetingConfig with callbacks:', {
                            hasCallbacks: !!(window.meetingConfig.success && window.meetingConfig.error),
                            role: role
                        });
                        
                        // Join the meeting
                        console.log('🚀🚀🚀 Attempting to join meeting:', {
                            meetingNumber: meetingNumber,
                            userName: userName,
                            hasPassword: !!password,
                            signatureLength: signature ? signature.length : 0
                        });
                        
                        // Update loading status
                        const statusEl = document.getElementById('loading-status');
                        if (statusEl) {
                            statusEl.textContent = 'Joining meeting... Please allow camera and microphone access.';
                        }
                        
                        console.log('📞 Calling ZoomMtg.join() now...');
                        
                        // Fallback: If callbacks don't fire within 15 seconds, hide loading anyway
                        setTimeout(() => {
                            if (!joinCallbacksFired) {
                                console.warn('⚠️ Join callbacks did not fire within 15 seconds, hiding loading screen anyway');
                                updateDebugStatus('⚠️ Callbacks timeout - hiding loading');
                                hideLoading();
                            }
                        }, 15000);
                        
                        // Only join if initialization was successful
                        if (!zoomInitialized) {
                            console.error('❌ Cannot join - Zoom SDK not initialized');
                            showError('Failed to initialize Zoom', 'Zoom SDK initialization failed. Please refresh the page.');
                            return;
                        }
                        
                        try {
                            console.log('📞 Calling ZoomMtg.join() with config:', {
                                meetingNumber: meetingNumber,
                                userName: userName,
                                hasSignature: !!signature,
                                hasSdkKey: !!sdkKey,
                                hasPassword: !!password,
                                hasZak: !!zak,
                                role: role,
                                joinEmail: joinEmail || '(none)'
                            });
                            ZoomMtg.join(meetingConfig);
                            console.log('📞 ZoomMtg.join() called successfully');
                            updateDebugStatus('Join called, waiting for response...');
                        } catch (error) {
                            console.error('❌ Exception calling ZoomMtg.join():', error);
                            console.error('❌ Exception stack:', error.stack);
                            showError('Failed to join meeting', error.message || 'Unknown error occurred');
                        }
                    },
                    error: function(err) {
                        zoomInitialized = false;
                        console.error('❌ Zoom initialization error:', err);
                        console.error('❌ Init error details:', JSON.stringify(err, null, 2));
                        console.error('❌ Error type:', typeof err);
                        console.error('❌ Error keys:', Object.keys(err || {}));
                        
                        const errorMessage = err?.reason || err?.errorMessage || err?.error || err?.message || JSON.stringify(err) || 'Unknown error';
                        console.error('❌ Final error message:', errorMessage);
                        
                        // Hide loading screen
                        hideLoading();
                        
                        // Show error to user
                        showError('Failed to initialize Zoom', errorMessage + '. Please check your browser console for more details.');
                    }
                });

            } catch (error) {
                console.error('Error:', error);
                showError('Error joining meeting', error.message);
            }
        });

        function showError(message, details) {
            document.getElementById('loading-container').style.display = 'none';
            document.getElementById('error-container').style.display = 'flex';
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-details').textContent = details || '';
        }
    </script>
</body>
</html>
